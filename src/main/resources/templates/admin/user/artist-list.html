<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý nghệ sĩ - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
<div class="min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r p-4 hidden md:block">
        <div class="mb-6">
            <div class="font-semibold text-lg">Harmonia Admin</div>
            <div class="text-xs text-gray-500">Quản trị</div>
        </div>
        <nav class="space-y-1 text-sm">
            <a th:href="@{/admin/songs}" class="block px-3 py-2 rounded hover:bg-gray-50">Bài hát</a>
            <a th:href="@{/admin/artists}" class="block px-3 py-2 rounded bg-indigo-50 text-indigo-700">Nghệ sĩ</a>
            <a th:href="@{/admin/users}" class="block px-3 py-2 rounded hover:bg-gray-50">Người dùng</a>
        </nav>
    </aside>

    <div class="flex-1 p-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-2xl font-bold">Danh sách nghệ sĩ</h2>
                <p class="text-sm text-gray-500">Quản lý thông tin nghệ sĩ trong hệ thống</p>
            </div>
            <a th:href="@{/admin/artists/add}" class="px-4 py-2 bg-indigo-600 text-white rounded shadow hover:opacity-95">➕ Thêm nghệ sĩ</a>
        </div>

        <div class="bg-white rounded shadow overflow-auto">
            <table class="min-w-full text-sm">
                <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="p-3 text-left">#</th>
                    <th class="p-3 text-left">Tên nghệ sĩ</th>
                    <th class="p-3 text-left">Email</th>
                    <th class="p-3 text-left">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a,iter : ${artists}" class="border-b hover:bg-gray-50">
                    <td class="p-3" th:text="${iter.index + 1}">1</td>
                    <td class="p-3 font-medium" th:text="${a.username}">Tên nghệ sĩ</td>
                    <td class="p-3" th:text="${a.email}">email@example.com</td>
                    <td class="p-3">
                        <a th:href="@{'/admin/artists/edit/' + ${a.userId}}" class="text-indigo-600 hover:underline mr-3">Sửa</a>
                        <a th:href="@{'/admin/artists/delete/' + ${a.userId}}" class="text-red-600 hover:underline" onclick="return confirm('Xóa nghệ sĩ này?');">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
