<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
<div class="min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r p-4 hidden md:block">
        <div class="mb-6">
            <div class="font-semibold text-lg">Harmonia Admin</div>
            <div class="text-xs text-gray-500">Quản trị</div>
        </div>
        <nav class="space-y-1 text-sm">
            <a th:href="@{/admin/songs}" class="block px-3 py-2 rounded hover:bg-gray-50">Quản lý bài hát</a>
            <a th:href="@{/admin/artists}" class="block px-3 py-2 rounded hover:bg-gray-50">Nghệ sĩ</a>
            <a th:href="@{/admin/users}" class="block px-3 py-2 rounded bg-indigo-50 text-indigo-700">Người dùng</a>
        </nav>
    </aside>

    <!-- Content -->
    <div class="flex-1 p-6">
        <div class="max-w-6xl bg-white rounded shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold">Danh sách người dùng</h1>
                <a th:href="@{/admin/users/create}" class="px-4 py-2 bg-blue-600 text-white rounded">+ Thêm User</a>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full border text-sm">
                    <thead>
                    <tr class="bg-gray-200 text-left">
                        <th class="p-2">ID</th>
                        <th class="p-2">Username</th>
                        <th class="p-2">Email</th>
                        <th class="p-2">Role</th>
                        <th class="p-2">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}" class="border-t hover:bg-gray-50">
                        <td class="p-2" th:text="${user.userId}"></td>
                        <td class="p-2" th:text="${user.username}"></td>
                        <td class="p-2" th:text="${user.email}"></td>
                        <td class="p-2" th:text="${user.role}"></td>
                        <td class="p-2 space-x-3">
                            <a th:href="@{'/admin/users/edit/' + ${user.userId}}" class="text-blue-600 hover:underline">Sửa</a>
                            <a th:href="@{'/admin/users/delete/' + ${user.userId}}"
                               class="text-red-600 hover:underline"
                               onclick="return confirm('Bạn có chắc muốn xóa user này?')">
                                Xóa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
