<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#4f46e5', // Màu Indigo
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-700 font-sans">
<div class="min-h-screen flex">

    <aside class="w-64 bg-gray-800 text-white shadow-xl flex flex-col">
        <div class="p-6 mb-4 border-b border-gray-700">
            <div class="font-bold text-xl text-primary">Harmonia Admin</div>
            <div class="text-xs text-gray-400">Bảng điều khiển</div>
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm">
            <a th:href="@{/admin/songs}" class="flex items-center px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"/><path d="M10 15V9l6 3z"/></svg>
                Quản lý bài hát
            </a>
            <a th:href="@{/admin/artists}" class="flex items-center px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Nghệ sĩ
            </a>
            <a th:href="@{/admin/users}" class="flex items-center px-4 py-2 rounded-lg bg-primary text-white font-medium shadow-md shadow-primary/30 transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-5 11H8v-2h6v2zm4-4H8v-2h10v2zm0-4H8v-2h10v2z"/></svg>
                Người dùng
            </a>
        </nav>
    </aside>

    <div class="flex-1 p-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-3xl font-bold text-gray-800">Danh sách người dùng</h2>
                <p class="text-sm text-gray-500 mt-1">Quản lý tài khoản người dùng và vai trò (Role).</p>
            </div>
            <a th:href="@{/admin/users/create}"
               class="px-5 py-2 bg-gray-200 text-gray-800 rounded-lg font-medium shadow-md hover:bg-gray-300 transition duration-200">
                ➕ Thêm người dùng
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-xl overflow-hidden">
            <table class="min-w-full text-sm divide-y divide-gray-200">
                <thead class="bg-gray-100">
                <tr>
                    <th class="p-4 text-left font-semibold text-gray-600">ID</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Username</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Email</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Role</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Thao tác</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="user : ${users}" class="hover:bg-indigo-50/50 transition duration-150">
                    <td class="p-4 font-mono text-gray-600" th:text="${user.userId}">1</td>
                    <td class="p-4 font-semibold text-gray-800" th:text="${user.username}">user123</td>
                    <td class="p-4 text-gray-600" th:text="${user.email}">user@example.com</td>
                    <td class="p-4">
                        <span th:classappend="${user.role == 'ADMIN' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}"
                              class="px-3 py-1 text-xs font-semibold rounded-full">
                            [[${user.role}]]
                        </span>
                    </td>
                    <td class="p-4 whitespace-nowrap">
                        <a th:href="@{'/admin/users/edit/' + ${user.userId}}" class="text-primary hover:text-indigo-700 font-medium mr-4 transition duration-150">Sửa</a>
                        <a th:href="@{'/admin/users/delete/' + ${user.userId}}"
                           class="text-red-500 hover:text-red-700 font-medium"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa user này không?');">
                            Xóa
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
