<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý bài hát - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#4f46e5', // Màu Indigo
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-700 font-sans">
<div class="min-h-screen flex">

    <aside class="w-64 bg-gray-800 text-white shadow-xl flex flex-col">
        <div class="p-6 mb-4 border-b border-gray-700">
            <div class="font-bold text-xl text-primary">Harmonia Admin</div>
            <div class="text-xs text-gray-400">Bảng điều khiển</div>
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm">
            <a th:href="@{/admin/songs}" class="flex items-center px-4 py-2 rounded-lg bg-primary text-white font-medium shadow-md shadow-primary/30 transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"/><path d="M10 15V9l6 3z"/></svg>
                Quản lý bài hát
            </a>
            <a th:href="@{/admin/artists}" class="flex items-center px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Nghệ sĩ
            </a>
            <a th:href="@{/admin/users}" class="flex items-center px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-5 11H8v-2h6v2zm4-4H8v-2h10v2zm0-4H8v-2h10v2z"/></svg>
                Người dùng
            </a>
        </nav>
    </aside>

    <div class="flex-1 p-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-3xl font-bold text-gray-800">Danh sách bài hát</h2>
                <p class="text-sm text-gray-500 mt-1">Quản lý, thêm, sửa hoặc xóa bài hát trong hệ thống.</p>
            </div>
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/songs/add}"
                   class="px-5 py-2 bg-gray-200 text-gray-800 rounded-lg font-medium shadow-md hover:bg-gray-300 transition duration-200">
                    ➕ Thêm bài hát mới
                </a>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-4 mb-6 p-4 bg-white rounded-xl shadow-md">
            <input id="tableSearch" type="text" placeholder="Tìm theo tiêu đề hoặc nghệ sĩ" class="flex-1 min-w-[200px] border border-gray-300 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-2 transition duration-150" />
            <select id="filterArtist" class="border border-gray-300 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-2 transition duration-150">
                <option value="">Tất cả nghệ sĩ</option>
            </select>
        </div>

        <div class="bg-white rounded-xl shadow-xl overflow-hidden">
            <table class="min-w-full text-sm divide-y divide-gray-200">
                <thead class="bg-gray-100">
                <tr>
                    <th class="p-4 text-left font-semibold text-gray-600">#</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Bài hát</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Nghệ sĩ</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Thời lượng</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Lượt phát</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Ngày tạo</th>
                    <th class="p-4 text-left font-semibold text-gray-600">Hành động</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="s, iterStat : ${songs}" class="hover:bg-indigo-50/50 transition duration-150">
                    <td class="p-4" th:text="${iterStat.index + 1}">1</td>
                    <td class="p-4 flex items-center gap-4">
                        <img th:src="@{${s.cover}}"
                             alt="cover"
                             class="w-14 h-14 rounded-md object-cover shadow-md" />
                        <div>
                            <div class="font-semibold text-gray-800" th:text="${s.title}">Tiêu đề</div>
                            <div class="text-xs text-gray-400 mt-0.5" th:text="${s.file}">/uploads/song.mp3</div>
                        </div>
                    </td>
                    <td class="p-4 text-gray-600" th:text="${s.artistName}">Artist</td>
                    <td class="p-4 text-gray-600" th:text="${s.duration}">03:20</td>
                    <td class="p-4 font-semibold text-primary" th:text="${s.playCount}">123</td>
                    <td class="p-4 text-gray-600" th:text="${#temporals.format(s.createdAt, 'dd/MM/yyyy')}"></td>
                    <td class="p-4 whitespace-nowrap">
                        <a th:href="@{'/admin/songs/edit/' + ${s.songId}}" class="text-primary hover:text-indigo-700 font-medium mr-4 transition duration-150">Sửa</a>
                        <a th:href="@{'/admin/songs/delete/' + ${s.songId}}" class="text-red-500 hover:text-red-700 font-medium" onclick="return confirm('Bạn có chắc chắn muốn xóa bài hát này không?');">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <script>
            // Giữ nguyên script lọc
            (function(){
                const tableSearch = document.getElementById('tableSearch');
                if(!tableSearch) return;
                tableSearch.addEventListener('input', function(e){
                    const q = e.target.value.toLowerCase();
                    document.querySelectorAll('tbody tr').forEach(tr => {
                        const title = tr.querySelector('td:nth-child(2) .font-semibold')?.innerText.toLowerCase() || '';
                        const artist = tr.querySelector('td:nth-child(3)')?.innerText.toLowerCase() || '';
                        tr.style.display = (title.includes(q) || artist.includes(q)) ? '' : 'none';
                    });
                });
            })();
        </script>
    </div>
</div>
</body>
</html>
