<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${pageTitle} ?: 'Admin - Harmonia'">Admin - Harmonia</title>
    <!-- Tailwind CDN (development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Small helpers for admin look */
        .nav-item-active { @apply bg-indigo-50 text-indigo-700; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
<div class="min-h-screen flex">
    <!-- SIDEBAR -->
    <aside class="w-72 bg-white border-r shadow-sm">
        <div class="p-6 flex items-center gap-3 border-b">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold">H</div>
            <div>
                <div class="font-semibold">Harmonia Admin</div>
                <div class="text-xs text-gray-500">Quản trị hệ thống</div>
            </div>
        </div>

        <nav class="p-4">
            <ul class="space-y-1">
                <li>
                    <a th:href="@{/admin}" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-50">
                        <span>🏠</span>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/songs}" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-50 nav-item-active">
                        <span>🎵</span>
                        <span>Quản lý bài hát</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/artists}" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-50">
                        <span>🎤</span>
                        <span>Nghệ sĩ</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/users}" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-50">
                        <span>👥</span>
                        <span>Người dùng</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/settings}" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-50">
                        <span>⚙️</span>
                        <span>Cài đặt</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="mt-auto p-4 border-t text-sm text-gray-500">
            <div>Phiên bản Admin • v1.0</div>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="flex-1 flex flex-col">
        <!-- HEADER -->
        <header class="h-16 bg-white border-b flex items-center justify-between px-6">
            <div class="flex items-center gap-4">
                <button id="sidebarToggle" class="md:hidden p-2 rounded hover:bg-gray-100">☰</button>
                <h1 class="text-lg font-semibold" th:text="${pageTitle} ?: 'Trang quản trị'">Trang quản trị</h1>
            </div>

            <div class="flex items-center gap-4">
                <div class="relative">
                    <input id="globalSearch" type="text" placeholder="Tìm bài, nghệ sĩ..." class="border rounded-full px-4 py-1 w-64 focus:outline-none focus:ring" />
                </div>
                <div class="flex items-center gap-3">
                    <img src="https://i.pravatar.cc/40" alt="admin" class="w-9 h-9 rounded-full" />
                    <div class="text-sm">
                        <div class="font-medium">Admin</div>
                        <div class="text-xs text-gray-500">Administrator</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="p-6 overflow-auto">
            <!-- The page content will be placed here by each page file (copy/paste the header & sidebar or use fragments). -->
            <div th:insert="~{::content}"></div>
        </main>
    </div>
</div>

<!-- Small helper script: bind global search into a custom event so pages can react -->
<script>
    const globalSearch = document.getElementById('globalSearch');
    if (globalSearch) {
        globalSearch.addEventListener('input', (e) => {
            window.dispatchEvent(new CustomEvent('admin:search', { detail: e.target.value }));
        });
    }
</script>
</body>
</html>
